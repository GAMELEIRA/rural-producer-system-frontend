<h2 class="auth-page__title">Recuperar senha</h2>
<p class="auth-page__subtitle">
  Informe seu e-mail e enviaremos as instruções para redefinir sua senha.
</p>

@if (sent()) {
  <div class="auth-page__alert auth-page__alert--success" role="status">
    Se o e-mail estiver cadastrado, você receberá as instruções em instantes.
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field label="E-mail" [control]="form.controls.email" forId="email">
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="voce@exemplo.com"
      />
    </app-form-field>

    @if (error()) {
      <div class="auth-page__alert auth-page__alert--error" role="alert">{{ error() }}</div>
    }

    <button class="btn btn--primary btn--block" type="submit" [disabled]="loading()">
      {{ loading() ? 'Enviando...' : 'Enviar instruções' }}
    </button>
  </form>
}

<p class="auth-page__footer">
  <a routerLink="/auth/login">Voltar para o login</a>
</p>
