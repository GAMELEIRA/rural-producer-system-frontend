<h2 class="auth-page__title">Entrar</h2>
<p class="auth-page__subtitle">Acesse sua conta para continuar.</p>

@if (registered) {
  <div class="auth-page__alert auth-page__alert--success" role="status">
    Conta criada com sucesso! Faça login para continuar.
  </div>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-form-field label="E-mail" [control]="form.controls.email" forId="email">
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="voce@exemplo.com"
    />
  </app-form-field>

  <app-form-field label="Senha" [control]="form.controls.password" forId="password">
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
    />
  </app-form-field>

  <div class="auth-page__links">
    <a routerLink="/auth/forgot-password">Esqueci minha senha</a>
  </div>

  <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Entrando...' : 'Entrar' }}
  </button>
</form>

<p class="auth-page__footer">Ainda não tem conta? <a routerLink="/auth/register">Criar conta</a></p>
