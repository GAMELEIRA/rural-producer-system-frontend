<div class="toast-container" aria-live="polite">
  @for (item of notifications.notifications(); track item.id) {
    <div class="toast" [class]="'toast toast--' + item.type" role="alert">
      <span class="toast__message">{{ item.message }}</span>
      <button
        class="toast__close"
        type="button"
        aria-label="Fechar"
        (click)="notifications.dismiss(item.id)"
      >
        ×
      </button>
    </div>
  }
</div>
